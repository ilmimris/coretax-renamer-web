<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coretax Renamer</title>
  <link rel="manifest" href="manifest.json?v=b50e7bb5">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="style.css?v=b50e7bb5">
</head>
<body>
  <div class="app">
    <header>
      <h1>📄 Coretax Renamer</h1>
      <p class="subtitle">Batch-rename Faktur Pajak PDFs — client-side &amp; offline</p>
    </header>

    <!-- Settings Panel -->
    <section class="settings">
      <details>
        <summary>⚙️ Settings</summary>
        <div class="settings-content">
          <label>
            Filename delimiter (Phase 0)
            <select id="delimiter">
              <option value=" ">Space (default)</option>
              <option value="_">Underscore</option>
              <option value="-">Hyphen</option>
              <option value=".">Dot</option>
              <option value="custom">Custom…</option>
            </select>
          </label>
          <label id="custom-delimiter-label" style="display:none;">
            Custom delimiter
            <input type="text" id="custom-delimiter" maxlength="5" placeholder="e.g. _-_">
          </label>
          <label>
            Filename template
            <input type="text" id="template" value="{invoice}{d}{name}{d}{kode}" placeholder="{invoice}{d}{name}{d}{kode}">
            <small>{invoice} = ref, {name} = buyer, {kode} = faktur code, {d} = delimiter</small>
          </label>
          <label>
            <input type="checkbox" id="include-ext" checked>
            Keep .pdf extension
          </label>
        </div>
      </details>
    </section>

    <!-- Drop Zone -->
    <section class="drop-zone" id="drop-zone">
      <div class="drop-zone-inner">
        <span class="drop-icon">📥</span>
        <p>Drop Faktur Pajak PDFs here</p>
        <p class="small">or</p>
        <button id="browse-btn" class="btn">Browse PDFs…</button>
        <input type="file" id="file-input" multiple accept=".pdf,application/pdf" hidden>
      </div>
    </section>

    <!-- Toolbar -->
    <section class="toolbar" id="toolbar" style="display:none;">
      <button id="apply-btn" class="btn btn-primary" disabled>Apply (0)</button>
      <button id="clear-btn" class="btn">Clear completed</button>
      <button id="download-all-btn" class="btn" disabled>⬇ Download All</button>
      <span class="counter" id="counter"></span>
    </section>

    <!-- Job List -->
    <section class="job-list" id="job-list">
      <table id="jobs-table" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Original filename</th>
            <th>Status</th>
            <th>New filename</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
      </table>
    </section>
  </div>

  <!-- PDF.js from CDN (cached by service worker for offline) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script src="app.mjs" type="module"></script>
  <!-- Umami Analytics -->
  <script defer src="https://umami.mris.dev/script.js" data-website-id="cd352f20-90d5-495a-8721-50cb4c9a068a"></script>
</body>
</html>
