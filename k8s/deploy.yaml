apiVersion: v1
kind: Namespace
metadata:
  name: coretax-renamer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coretax-renamer
  namespace: coretax-renamer
  labels:
    app: coretax-renamer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coretax-renamer
  template:
    metadata:
      labels:
        app: coretax-renamer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: coretax-renamer
          image: ghcr.io/ilmimris/coretax-renamer-web:a3ba795
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: coretax-renamer
  namespace: coretax-renamer
  labels:
    app: coretax-renamer
spec:
  selector:
    app: coretax-renamer
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coretax-renamer
  namespace: coretax-renamer
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - coretax.mris.dev
      secretName: coretax-renamer-tls
  rules:
    - host: coretax.mris.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coretax-renamer
                port:
                  number: 80
